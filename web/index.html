<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="From lead to deal, one clear path.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masar | CRM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masar | CRM</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fff8ea;
    }

    #masar-web-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff8ea;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #masar-web-preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .masar-preloader-core {
      display: grid;
      gap: 14px;
      justify-items: center;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    }

    .masar-preloader-mark {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 16px 34px rgba(16, 34, 53, 0.10);
    }

    @media (max-width: 600px), (pointer: coarse) and (max-width: 900px) {
      .masar-preloader-core {
        gap: 16px;
      }

      .masar-preloader-mark {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }

      .masar-preloader-dot {
        width: 7px;
        height: 7px;
      }
    }

    .masar-preloader-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #d9952e;
      animation: masar-pulse 900ms ease-in-out infinite;
    }

    .masar-preloader-fallback {
      display: none;
      max-width: 320px;
      padding: 0 24px;
      color: #756b5a;
      font: 500 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #masar-web-preloader.has-error .masar-preloader-dot {
      display: none;
    }

    #masar-web-preloader.has-error .masar-preloader-fallback {
      display: block;
    }

    @keyframes masar-pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <script>
    (function () {
      function hideMasarPreloader() {
        var preloader = document.getElementById('masar-web-preloader');
        if (!preloader) {
          return;
        }
        preloader.classList.add('is-hidden');
        window.setTimeout(function () {
          preloader.remove();
        }, 240);
      }

      function showMasarPreloaderError() {
        var preloader = document.getElementById('masar-web-preloader');
        if (!preloader) {
          return;
        }
        preloader.classList.add('has-error');
      }

      window.addEventListener('flutter-first-frame', hideMasarPreloader, {
        once: true
      });
      window.addEventListener('masar-flutter-load-error', showMasarPreloaderError);
      window.addEventListener('error', function (event) {
        var message = event && event.message ? event.message : '';
        if (message.indexOf('canvaskit') !== -1 ||
            message.indexOf('dynamically imported module') !== -1) {
          showMasarPreloaderError();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (reason.indexOf('canvaskit') !== -1 ||
            reason.indexOf('dynamically imported module') !== -1 ||
            reason.indexOf('Failed to fetch') !== -1) {
          showMasarPreloaderError();
        }
      });
      window.setTimeout(showMasarPreloaderError, 15000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(function (error) {
            console.warn('Masar FCM service worker registration failed.', error);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <div id="masar-web-preloader" aria-hidden="true">
    <div class="masar-preloader-core">
      <img class="masar-preloader-mark" src="icons/Icon-192.png" alt="">
      <div class="masar-preloader-dot"></div>
      <div class="masar-preloader-fallback">
        Masar CRM could not load the web renderer. Try the WebAssembly run mode for local testing.
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
