name: real_estate_crm
description: Real estate CRM built with Flutter and Firebase.
publish_to: 'none'
version: 1.2.3+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  go_router: ^16.3.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.4.0
  cloud_functions: ^6.0.4
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.5
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  visibility_detector: ^0.4.0+2
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true
